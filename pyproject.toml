[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jlt"]

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

[project]
name = "jlt"
version = "0.0.1"
license = "Apache-2.0"
authors = [
  { name = "Alberto (Jesus) Zancanaro", email = "alberto.zancanaro.1@gmail.com" },
]
description = "Jesus's LLM Tools (JLT): a collection of LLM-powered tools."
requires-python = ">=3.11"
# The core package only depends on `tomli-w` : the standard library can read
# toml (`tomllib`) but cannot write it, and writing toml is needed to persist
# experiment configuration files (see `jlt.shared_knowledge.config_io`).
# Each backend still pulls its own provider SDK through the optional-dependencies
# below (e.g. `pip install jlt[claude]`).
dependencies = [
    "tomli-w",
]

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

[project.optional-dependencies]
# One extra per backend, so the user can install only what is needed.
# E.g. `pip install jlt[claude]` to use JLT with Claude only.
claude         = ["anthropic"]
chat_gpt       = ["openai"]
github_copilot = ["openai"]
ollama         = ["ollama"]
# Convenience extra installing the SDKs of every backend at once.
all-backends   = ["anthropic", "openai", "ollama"]

[project.scripts]
jlt = "jlt.cli:main"
